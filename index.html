<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OA Early Detection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f7;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .value {
            font-size: 30px;
            font-weight: bold;
        }

        .unit {
            color: #666;
        }

        .status {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <div id="loginSection" class="card">

        <h1>OA Early Detection</h1>
        <h2>Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <br>

        <button id="loginButton">
            Login
        </button>

        <button id="signupButton">
            Create Account
        </button>

        <p id="authMessage"></p>

    </div>


    <!-- DASHBOARD -->
    <div id="dashboardSection" class="hidden">

        <h1>OA Early Detection</h1>

        <p>ESP32 + AD5933 Monitoring System</p>

        <div class="card">
            <h2>Impedance</h2>
            <div class="value">
                <span id="impedance">Loading...</span>
            </div>
            <div class="unit">Ω</div>
        </div>

        <div class="card">
            <h2>Frequency</h2>
            <div class="value">
                <span id="frequency">Loading...</span>
            </div>
            <div class="unit">Hz</div>
        </div>

        <div class="card">
            <h2>Phase</h2>
            <div class="value">
                <span id="phase">Loading...</span>
            </div>
            <div class="unit">degrees</div>
        </div>

        <div class="card">
            <h2>Status</h2>

            <div id="status" class="status">
                Monitoring
            </div>

            <p id="statusMessage">
                Waiting for sensor data
            </p>
        </div>

        <div class="card">
            <h3>Last Update</h3>
            <p id="lastUpdate">Waiting...</p>

            <button id="logoutButton">
                Logout
            </button>
        </div>

    </div>

</div>


<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
        getDatabase,
        ref,
        onValue
    }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword,
        sendEmailVerification,
        signOut,
        onAuthStateChanged
    }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    // ==================================================
    // PUT YOUR EXISTING FIREBASE CONFIG HERE
    // ==================================================

    const firebaseConfig = {
  apiKey: "AIzaSyAqV7ug-2GweTmsuVsw4-jfPZZN89Ixro4",
  authDomain: "oa-early-detection-5c20b.firebaseapp.com",
  databaseURL: "https://oa-early-detection-5c20b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "oa-early-detection-5c20b",
  storageBucket: "oa-early-detection-5c20b.firebasestorage.app",
  messagingSenderId: "114789054894",
  appId: "1:114789054894:web:b5debaddfccb84287d303f"
};

    // ==================================================
    // FIREBASE SETUP
    // ==================================================

    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);

    const auth = getAuth(app);


    // ==================================================
    // HTML ELEMENTS
    // ==================================================

    const loginSection =
        document.getElementById("loginSection");

    const dashboardSection =
        document.getElementById("dashboardSection");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const authMessage =
        document.getElementById("authMessage");


    // ==================================================
    // CREATE ACCOUNT
    // ==================================================

    document.getElementById("signupButton")
        .addEventListener("click", async () => {

            const email = emailInput.value;

            const password = passwordInput.value;

            if (!email || !password) {

                authMessage.innerText =
                    "Enter email and password.";

                return;
            }

            try {

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                await sendEmailVerification(
                    userCredential.user
                );

                authMessage.innerText =
                    "Account created! Please check your email and verify your account.";

            } catch (error) {

                authMessage.innerText =
                    error.message;

            }

        });


    // ==================================================
    // LOGIN
    // ==================================================

    document.getElementById("loginButton")
        .addEventListener("click", async () => {

            const email = emailInput.value;

            const password = passwordInput.value;

            if (!email || !password) {

                authMessage.innerText =
                    "Enter email and password.";

                return;
            }

            try {

                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                if (!userCredential.user.emailVerified) {

                    authMessage.innerText =
                        "Please verify your email before logging in.";

                    await signOut(auth);

                    return;
                }

                authMessage.innerText =
                    "Login successful!";

            } catch (error) {

                authMessage.innerText =
                    error.message;

            }

        });


    // ==================================================
    // LOGOUT
    // ==================================================

    document.getElementById("logoutButton")
        .addEventListener("click", async () => {

            await signOut(auth);

        });


    // ==================================================
    // CHECK LOGIN STATUS
    // ==================================================

    onAuthStateChanged(auth, (user) => {

        if (user && user.emailVerified) {

            loginSection.classList.add("hidden");

            dashboardSection.classList.remove("hidden");

            loadSensorData();

        } else {

            loginSection.classList.remove("hidden");

            dashboardSection.classList.add("hidden");

        }

    });


    // ==================================================
    // LOAD SENSOR DATA
    // ==================================================

    function loadSensorData() {

        const sensorRef =
            ref(database, "sensorData/ESP32_01");


        onValue(sensorRef, (snapshot) => {

            const data = snapshot.val();

            console.log("Firebase data:", data);


            if (data) {

                document.getElementById("impedance")
                    .innerText =
                    data.impedance ?? "N/A";

                document.getElementById("frequency")
                    .innerText =
                    data.frequency ?? "N/A";

                document.getElementById("phase")
                    .innerText =
                    data.phase ?? "N/A";

                document.getElementById("lastUpdate")
                    .innerText =
                    new Date().toLocaleString();

            }

        });

    }

</script>

</body>
</html>
