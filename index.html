<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Osteotrack</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5f7;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin-bottom: 10px;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-top: 25px;
    }

    input {
      width: 90%;
      max-width: 500px;
      padding: 15px;
      margin: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      padding: 13px 25px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .login-btn {
      background: #4CAF50;
      color: white;
    }

    .create-btn {
      background: #2196F3;
      color: white;
    }

    .logout-btn {
      background: #f44336;
      color: white;
    }

    .resend-btn {
      background: #ff9800;
      color: white;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    #dashboard {
      display: none;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .card h2 {
      margin: 5px 0;
      font-size: 32px;
    }

    .card p {
      margin: 5px;
      color: #555;
    }

    .status {
      font-size: 24px;
      font-weight: bold;
    }

    .online {
      color: green;
    }

    .offline {
      color: red;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Osteotrack</h1>

  <!-- LOGIN SECTION -->
  <div id="loginBox" class="box">

    <h2>Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
    >

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
    >

    <br>

    <button class="login-btn" id="loginBtn">
      Login
    </button>

    <button class="create-btn" id="createBtn">
      Create Account
    </button>

    <button
      class="resend-btn"
      id="resendBtn"
      style="display:none;"
    >
      Resend Verification Email
    </button>

    <p id="message"></p>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="box">

    <h2>OA Sensor Dashboard</h2>

    <p>
      Logged in as:
      <strong id="userEmail"></strong>
    </p>

    <button class="logout-btn" id="logoutBtn">
      Logout
    </button>


    <div class="cards">

      <!-- HEART RATE -->
      <div class="card">
        <p>❤️ Heart Rate</p>

        <h2>
          <span id="heartRate">--</span>
        </h2>

        <p>BPM</p>
      </div>


      <!-- SPO2 -->
      <div class="card">
        <p>🫁 SpO₂</p>

        <h2>
          <span id="spo2">--</span>
        </h2>

        <p>%</p>
      </div>


      <!-- DEVICE STATUS -->
      <div class="card">
        <p>Device Status</p>

        <h2
          class="status offline"
          id="status"
        >
          OFFLINE
        </h2>
      </div>

    </div>


    <!-- LAST UPDATE -->
    <p>
      Last update:
      <strong id="lastUpdate">--</strong>
    </p>

  </div>

</div>


<script type="module">

  /* =====================================================
     FIREBASE CONFIGURATION
     ===================================================== */

  const firebaseConfig = {
    apiKey: "AIzaSyAqV7ug-2GweTmsuVsw4-jfPZZN89Ixro4",
    authDomain: "oa-early-detection-5c20b.firebaseapp.com",
    databaseURL: "https://oa-early-detection-5c20b-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "oa-early-detection-5c20b",
    storageBucket: "oa-early-detection-5c20b.firebasestorage.app",
    messagingSenderId: "114789054894",
    appId: "1:114789054894:web:b5debaddfccb84287d303f"
  };


  /* =====================================================
     FIREBASE IMPORTS
     ===================================================== */

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getDatabase,
    ref,
    onValue
  }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    sendEmailVerification,
    signOut,
    onAuthStateChanged
  }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


  /* =====================================================
     INITIALIZE FIREBASE
     ===================================================== */

  const app = initializeApp(firebaseConfig);

  const database = getDatabase(app);

  const auth = getAuth(app);


  /* =====================================================
     HTML ELEMENTS
     ===================================================== */

  const loginBox = document.getElementById("loginBox");

  const dashboard = document.getElementById("dashboard");

  const emailInput = document.getElementById("email");

  const passwordInput = document.getElementById("password");

  const loginBtn = document.getElementById("loginBtn");

  const createBtn = document.getElementById("createBtn");

  const resendBtn = document.getElementById("resendBtn");

  const logoutBtn = document.getElementById("logoutBtn");

  const message = document.getElementById("message");

  const userEmail = document.getElementById("userEmail");


  /* =====================================================
     CREATE ACCOUNT
     ===================================================== */

  createBtn.addEventListener("click", async () => {

    const email = emailInput.value.trim();

    const password = passwordInput.value.trim();

    if (!email || !password) {

      message.innerText =
        "Please enter email and password.";

      return;
    }

    try {

      const userCredential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

      const user = userCredential.user;

      await sendEmailVerification(user);

      message.innerText =
        "Account created. Verification email sent. Please check your email.";

      await signOut(auth);

    }

    catch (error) {

      console.error(error);

      message.innerText =
        "Firebase: " + error.message;

    }

  });


  /* =====================================================
     LOGIN
     ===================================================== */

  loginBtn.addEventListener("click", async () => {

    const email = emailInput.value.trim();

    const password = passwordInput.value.trim();

    if (!email || !password) {

      message.innerText =
        "Please enter email and password.";

      return;
    }

    try {

      const userCredential =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      const user = userCredential.user;


      /* CHECK EMAIL VERIFICATION */

      if (!user.emailVerified) {

        try {

          await sendEmailVerification(user);

          message.innerText =
            "Your email is not verified. A new verification email has been sent. Please check your inbox and Spam folder.";

        }

        catch (verificationError) {

          console.error(verificationError);

          message.innerText =
            "Your email is not verified. Please check your inbox and Spam folder.";

        }

        await signOut(auth);

        return;
      }


      /* VERIFIED USER */

      message.innerText =
        "Login successful!";

      loginBox.style.display = "none";

      dashboard.style.display = "block";

      userEmail.innerText = user.email;

      loadSensorData();

    }

    catch (error) {

      console.error(error);

      message.innerText =
        "Firebase: " + error.message;

    }

  });


  /* =====================================================
     RESEND VERIFICATION EMAIL
     ===================================================== */

  resendBtn.addEventListener("click", async () => {

    const email = emailInput.value.trim();

    const password = passwordInput.value.trim();

    if (!email || !password) {

      message.innerText =
        "Enter your email and password first.";

      return;
    }

    try {

      const userCredential =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      const user = userCredential.user;

      if (user.emailVerified) {

        message.innerText =
          "Your email is already verified.";

        await signOut(auth);

        return;
      }

      await sendEmailVerification(user);

      message.innerText =
        "Verification email sent again. Please check your inbox and Spam folder.";

      await signOut(auth);

    }

    catch (error) {

      console.error(error);

      message.innerText =
        "Firebase: " + error.message;

    }

  });


  /* =====================================================
     LOGOUT
     ===================================================== */

  logoutBtn.addEventListener("click", async () => {

    await signOut(auth);

    dashboard.style.display = "none";

    loginBox.style.display = "block";

    message.innerText =
      "You have been logged out.";

  });


  /* =====================================================
     AUTH STATE
     ===================================================== */

  onAuthStateChanged(auth, (user) => {

    if (!user) {

      dashboard.style.display = "none";

      loginBox.style.display = "block";

    }

  });


  /* =====================================================
     READ SENSOR DATA
     ===================================================== */

  function loadSensorData() {

    const sensorRef =
      ref(database, "sensorData/ESP32_01");

    onValue(sensorRef, (snapshot) => {

      const data = snapshot.val();

      if (!data) {

        document.getElementById("heartRate").innerText = "--";

        document.getElementById("spo2").innerText = "--";

        document.getElementById("status").innerText =
          "OFFLINE";

        document.getElementById("status").className =
          "status offline";

        document.getElementById("lastUpdate").innerText =
          "--";

        return;
      }


      /* HEART RATE */

      document.getElementById("heartRate").innerText =
        data.heartRate ?? "--";


      /* SpO2 */

      document.getElementById("spo2").innerText =
        data.spo2 ?? "--";


      /* DEVICE STATUS */

      document.getElementById("status").innerText =
        "ONLINE";

      document.getElementById("status").className =
        "status online";


      /* TIMESTAMP */

      document.getElementById("lastUpdate").innerText =
    new Date().toLocaleString();

    });

  }

</script>

</body>
</html>
