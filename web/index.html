<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OsteoSense | Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2ef; --card:#ffffff; --ink:#16241f; --muted:#7c8a83;
  --brand:#12805f; --brand-soft:#e2f3ec;
  --blue:#3f7fd1; --blue-soft:#e7eefb;
  --red:#e5485f; --red-soft:#fde9ec;
  --amber:#e2932b; --amber-soft:#fdf1de;
  --line:#e3e8e4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.app{display:flex;min-height:100%}

/* sidebar */
.side{width:234px;background:var(--card);border-right:1px solid var(--line);padding:20px 12px;position:fixed;inset:0 auto 0 0;z-index:20;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 24px}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:16px}
.brand b{display:block;font-size:15px;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:9.5px;letter-spacing:.5px;margin-top:1px}
nav a{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;color:#5a675f;padding:10px 12px;border-radius:9px;margin:3px 0;font-size:13.5px;font-weight:600}
nav a .l{display:flex;align-items:center;gap:11px}
nav a.active{background:var(--brand);color:#fff}
nav a:hover:not(.active){background:#f1f5f2}
.ic{width:18px;text-align:center;font-size:14.5px;opacity:.9}
.pill{background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:1px 7px}
